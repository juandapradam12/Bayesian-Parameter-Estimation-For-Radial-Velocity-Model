[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-mcmc"
version = "1.0.0"
description = "Bayesian Monte Carlo estimation of galactic mass components from rotation curves"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juan Prada" }]
keywords = [
  "astronomy",
  "bayesian",
  "mcmc",
  "metropolis-hastings",
  "galaxy",
  "rotation-curve",
  "dark-matter",
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
